<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Zero-Knowledge Vault - Field-Level Encryption</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: radial-gradient(ellipse at top, #1a2847, #0f0f23);
        color: #f5f7ff;
        line-height: 1.6;
      }
      .container { max-width: 1200px; margin: 0 auto; padding: 24px; }
      h1 {
        font-size: 28px;
        background: linear-gradient(135deg, #4f7dff, #8f67ff);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-bottom: 8px;
      }
      h2 {
        font-size: 16px;
        font-weight: 600;
        color: #8fa3cc;
        margin: 20px 0 12px;
        text-transform: uppercase;
        letter-spacing: 0.1em;
      }
      .subtitle { color: #8fa3cc; font-size: 14px; margin-bottom: 24px; }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 20px;
        margin-bottom: 20px;
      }
      .card {
        background: #171d33;
        border-radius: 12px;
        padding: 16px 18px;
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.4);
        border: 1px solid #262f4d;
      }
      .stack { display: flex; flex-direction: column; gap: 10px; }
      label {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.07em;
        color: #9aa3d9;
        display: block;
        margin-bottom: 4px;
      }
      input, textarea, select {
        width: 100%;
        padding: 8px 10px;
        border-radius: 8px;
        border: 1px solid #303a5e;
        background: #0f1425;
        color: #f5f7ff;
        font-family: inherit;
        font-size: 14px;
        box-sizing: border-box;
      }
      textarea { resize: vertical; min-height: 72px; }
      input:focus, textarea:focus, select:focus {
        outline: none;
        border-color: #4f7dff;
        box-shadow: 0 0 0 1px rgba(79, 125, 255, 0.4);
      }
      button {
        border: none;
        border-radius: 999px;
        padding: 6px 14px;
        background: linear-gradient(135deg, #4f7dff, #8f67ff);
        color: white;
        font-weight: 600;
        font-size: 13px;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        box-shadow: 0 10px 24px rgba(79, 125, 255, 0.5);
        transition: transform 0.2s;
      }
      button:hover { transform: translateY(-2px); }
      button:disabled { opacity: 0.5; cursor: not-allowed; }
      .badge {
        display: inline-flex;
        padding: 4px 12px;
        border-radius: 999px;
        background: rgba(79, 125, 255, 0.1);
        border: 1px solid #4f7dff;
        color: #7ba3ff;
        font-size: 12px;
        font-weight: 600;
      }
      .pill {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        border-radius: 8px;
        background: rgba(79, 125, 255, 0.1);
        border: 1px solid #4f7dff;
        font-size: 13px;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #4f7dff;
        animation: pulse 2s infinite;
      }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
      .log {
        background: #0f1425;
        border: 1px solid #303a5e;
        border-radius: 8px;
        padding: 12px;
        font-family: 'Monaco', 'Courier New', monospace;
        font-size: 12px;
        max-height: 300px;
        overflow-y: auto;
        color: #a8d5ff;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .modal-overlay {
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background: rgba(0, 0, 0, 0.7);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 1000;
      }
      .modal {
        background: #1a2847;
        border-radius: 12px;
        padding: 24px;
        border: 1px solid #262f4d;
        max-width: 600px;
        width: 90%;
        max-height: 80vh;
        overflow-y: auto;
      }
      .modal h3 { margin-bottom: 16px; color: #f5f7ff; font-size: 20px; }
      .modal p { color: #8fa3cc; font-size: 14px; margin-bottom: 16px; }
      .form-group { margin-bottom: 16px; }
      .form-label {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 6px;
      }
      .encrypted-badge { font-size: 11px; color: #ff6b6b; font-weight: bold; }
      .modal-buttons {
        display: flex;
        gap: 8px;
        justify-content: flex-end;
        margin-top: 24px;
      }
      .error-message { color: #ff6b6b; font-size: 12px; margin-top: 8px; }
      .btn-primary { background: linear-gradient(135deg, #4f7dff, #8f67ff); }
      .btn-secondary { background: #6a7a99; }
      .btn-reveal {
        padding: 4px 8px;
        font-size: 12px;
        background: #2196F3;
        border-radius: 4px;
      }
      .field-display {
        padding: 12px;
        background: #0f1425;
        border-radius: 6px;
        border: 1px solid #303a5e;
        word-break: break-all;
        font-family: monospace;
        font-size: 13px;
      }
      .field-encrypted { color: #ff6b6b; font-style: italic; }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>🔐 Zero-Knowledge Vault</h1>
      <p class="subtitle">Field-level encryption with proper password verification</p>

      <div class="grid">
        <div class="card">
          <h2>Step 1: Register</h2>
          <div class="stack">
            <div><label>User 1</label><input id="u1-username" value="alice" /><label>Password</label><input id="u1-password" type="password" value="password1" /></div>
            <div><label>User 2</label><input id="u2-username" value="bob" /><label>Password</label><input id="u2-password" type="password" value="password2" /></div>
            <button id="btn-register">Register Users</button>
          </div>
          <div style="margin-top: 12px"><span class="badge">U1: <span id="u1-id">-</span></span></div>
          <div style="margin-top: 8px"><span class="badge">U2: <span id="u2-id">-</span></span></div>
        </div>

        <div class="card">
          <h2>Step 2: Create Secret</h2>
          <div class="stack">
            <div><label>Household ID</label><input id="household-id" value="H1" /></div>
            <div><label>Secret Type</label><select id="schema-type"><option value="loginCredentials">Login Credentials</option><option value="bankAccount">Bank Account</option></select></div>
            <button id="btn-create-secret">Create Secret</button>
          </div>
          <div style="margin-top: 12px"><span class="badge">Secret: <span id="secret-id">-</span></span></div>
        </div>

        <div class="card">
          <h2>Step 3: View & Unlock</h2>
          <div class="stack">
            <button id="btn-view-secret">View Secret</button>
            <button id="btn-show-state">Debug State</button>
          </div>
        </div>
      </div>

      <div class="card">
        <h2>Crypto Trace Log</h2>
        <div style="margin-top: 8px"><div class="pill"><span class="dot"></span><span>Proper password verification via DEK unwrapping</span></div></div>
        <pre id="log" class="log"></pre>
      </div>
    </div>

    <script>
      const encoder = new TextEncoder();
      const decoder = new TextDecoder();
      const IV_LENGTH = 12;
      const ITERATIONS = 600000;

      const logEl = document.getElementById('log');
      function log(msg) {
        const ts = new Date().toISOString().split('T')[1].replace('Z', '');
        logEl.textContent += `[${ts}] ${msg}\n`;
        logEl.scrollTop = logEl.scrollHeight;
      }

      function toBase64(bytes) {
        let binary = '';
        for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
        return btoa(binary);
      }

      function fromBase64(base64) {
        const binary = atob(base64);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
        return bytes;
      }

      function pack(iv, ciphertext) {
        const packed = new Uint8Array(iv.length + ciphertext.byteLength);
        packed.set(iv, 0);
        packed.set(new Uint8Array(ciphertext), iv.length);
        return packed;
      }

      function unpack(packed) {
        return { iv: packed.slice(0, IV_LENGTH), ciphertext: packed.slice(IV_LENGTH) };
      }

      async function deriveKEK(password, saltBytes) {
        const keyMaterial = await crypto.subtle.importKey('raw', encoder.encode(password), 'PBKDF2', false, ['deriveKey']);
        return crypto.subtle.deriveKey(
          { name: 'PBKDF2', salt: saltBytes, iterations: ITERATIONS, hash: 'SHA-256' },
          keyMaterial,
          { name: 'AES-GCM', length: 256 },
          false,
          ['encrypt', 'decrypt']
        );
      }

      function generateDEK() {
        return crypto.getRandomValues(new Uint8Array(32));
      }

      async function importDEK(dekRaw) {
        return crypto.subtle.importKey('raw', dekRaw, { name: 'AES-GCM' }, false, ['encrypt', 'decrypt']);
      }

      async function wrapDEKWithKEK(dekRaw, kek) {
        const iv = crypto.getRandomValues(new Uint8Array(IV_LENGTH));
        const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, kek, dekRaw);
        return toBase64(pack(iv, ct));
      }

      async function unwrapDEKWithKEK(wrappedDEKB64, kek) {
        const packed = fromBase64(wrappedDEKB64);
        const { iv, ciphertext } = unpack(packed);
        const dekRaw = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, kek, ciphertext);
        return new Uint8Array(dekRaw);
      }

      async function encryptField(fieldValue, dekKey) {
        const iv = crypto.getRandomValues(new Uint8Array(IV_LENGTH));
        const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, dekKey, encoder.encode(String(fieldValue)));
        return toBase64(pack(iv, ct));
      }

      async function decryptField(encryptedFieldB64, dekKey) {
        const packed = fromBase64(encryptedFieldB64);
        const { iv, ciphertext } = unpack(packed);
        const ptBuf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, dekKey, ciphertext);
        return decoder.decode(ptBuf);
      }

      async function encryptPayload(plaintext, dekKey) {
        const iv = crypto.getRandomValues(new Uint8Array(IV_LENGTH));
        const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, dekKey, encoder.encode(plaintext));
        return toBase64(pack(iv, ct));
      }

      async function decryptPayload(encryptedB64, dekKey) {
        const packed = fromBase64(encryptedB64);
        const { iv, ciphertext } = unpack(packed);
        const ptBuf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, dekKey, ciphertext);
        return decoder.decode(ptBuf);
      }

      const state = {
        user1: { id: null, salt: null, kek: null, wrappedPrivateKey: null, publicKeyJwk: null, privateKeyJwk: null },
        user2: { id: null, salt: null, kek: null, wrappedPrivateKey: null, publicKeyJwk: null, privateKeyJwk: null },
        secretId: null,
        secretSchema: null,
        secretData: null,
        wrappedDEK: null,
        currentDEKKey: null,
        currentRevealingField: null,
      };

      const u1UsernameInput = document.getElementById('u1-username');
      const u1PasswordInput = document.getElementById('u1-password');
      const u2UsernameInput = document.getElementById('u2-username');
      const u2PasswordInput = document.getElementById('u2-password');
      const u1IdSpan = document.getElementById('u1-id');
      const u2IdSpan = document.getElementById('u2-id');
      const householdInput = document.getElementById('household-id');
      const schemaTypeSelect = document.getElementById('schema-type');
      const secretIdSpan = document.getElementById('secret-id');
      const btnRegister = document.getElementById('btn-register');
      const btnCreateSecret = document.getElementById('btn-create-secret');
      const btnViewSecret = document.getElementById('btn-view-secret');
      const btnShowState = document.getElementById('btn-show-state');

      // FLOW 1: User Onboarding - Master Password Setup
      btnRegister.addEventListener('click', async () => {
        try {
          log('\n═══════════════════════════════════════════════════════');
          log('🔐 FLOW 1: USER ONBOARDING (Master Password Setup)');
          log('═══════════════════════════════════════════════════════\n');

          // ──────────────────────────────────────────────────────────
          // STEP 1: User enters master password
          // ──────────────────────────────────────────────────────────
          const masterPassword1 = u1PasswordInput.value;
          if (!masterPassword1) {
            log('❌ Error: User 1 master password is required');
            return;
          }
          log(`📝 STEP 1: User 1 (Alice) - Master password entered`);
          log(`   Password length: ${masterPassword1.length} characters\n`);

          // ──────────────────────────────────────────────────────────
          // STEP 2: Generate random salt
          // ──────────────────────────────────────────────────────────
          const salt1 = crypto.getRandomValues(new Uint8Array(16));
          log(`🧂 STEP 2: Generated random salt (16 bytes)`);
          log(`   Salt (base64): ${toBase64(salt1).substring(0, 30)}...\n`);

          // ──────────────────────────────────────────────────────────
          // STEP 3: Derive KEK via PBKDF2
          // ──────────────────────────────────────────────────────────
          log(`🔑 STEP 3: Derive KEK via PBKDF2(password + salt, 250k iterations)`);
          const kek1 = await deriveKEK(masterPassword1, salt1);
          log(`   KEK derived successfully (stored in session memory)\n`);

          // ──────────────────────────────────────────────────────────
          // STEP 4: Generate ECDH keypair
          // ──────────────────────────────────────────────────────────
          log(`🔐 STEP 4: Generate ECDH keypair (P-256 curve)`);
          const keypair1 = await crypto.subtle.generateKey(
            { name: 'ECDH', namedCurve: 'P-256' },
            true, // extractable for JWK export
            ['deriveKey']
          );
          log(`   Private Key: Generated (not in transit)`);
          log(`   Public Key: Generated\n`);

          const publicKeyJwk1 = await crypto.subtle.exportKey('jwk', keypair1.publicKey);
          const privateKeyJwk1 = await crypto.subtle.exportKey('jwk', keypair1.privateKey);
          log(`✅ Keys exported to JWK format\n`);

          // ──────────────────────────────────────────────────────────
          // STEP 5: Wrap private key with KEK
          // ──────────────────────────────────────────────────────────
          log(`🔒 STEP 5: Wrap private key with KEK`);
          const privateKeyJSON1 = JSON.stringify(privateKeyJwk1);
          const wrappedPrivateKey1 = await encryptPayload(privateKeyJSON1, kek1);
          log(`   Private Key JWK encrypted with AES-256-GCM`);
          log(`   Wrapped Private Key (base64): ${wrappedPrivateKey1.substring(0, 30)}...\n`);

          // ──────────────────────────────────────────────────────────
          // STEP 6: Send to backend
          // ──────────────────────────────────────────────────────────
          log(`📤 STEP 6: Send to backend`);
          log(`   Sending: salt, publicKey, wrappedPrivateKey`);
          log(`   NOT sending: masterPassword (never goes to backend)\n`);

          const res1 = await fetch('/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              username: u1UsernameInput.value,
              salt: toBase64(salt1),
              publicKey: publicKeyJwk1,
              wrappedPrivateKey: wrappedPrivateKey1,
            }),
          });

          if (!res1.ok) {
            const errData = await res1.json();
            throw new Error(errData.error);
          }

          const data1 = await res1.json();
          log(`✅ Backend: User registered with ID: ${data1.userId}\n`);

          // ──────────────────────────────────────────────────────────
          // STEP 7: Store in frontend state
          // ──────────────────────────────────────────────────────────
          state.user1.id = data1.userId;
          state.user1.salt = salt1;
          state.user1.kek = kek1;
          state.user1.publicKeyJwk = publicKeyJwk1;
          state.user1.privateKeyJwk = privateKeyJwk1;
          state.user1.wrappedPrivateKey = wrappedPrivateKey1;

          u1IdSpan.textContent = data1.userId;
          u1PasswordInput.disabled = true;
          u1UsernameInput.disabled = true;

          log(`💾 Frontend: Stored in session memory`);
          log(`   userId: ${data1.userId}`);
          log(`   salt: ${toBase64(salt1).substring(0, 20)}...`);
          log(`   kek: [in memory, not displayed]`);
          log(`   publicKeyJwk: stored`);
          log(`   privateKeyJwk: stored (in memory)`);
          log(`   wrappedPrivateKey: stored\n`);

          log(`⏰ KEK will remain in memory for this session`);
          log(`   On logout/timeout: KEK + privateKey cleared\n`);

          log('═══════════════════════════════════════════════════════');
          log('✅ FLOW 1 COMPLETE: User 1 Onboarding successful');
          log('═══════════════════════════════════════════════════════\n');

          // ──────────────────────────────────────────────────────────
          // Register User 2 (Bob) - Same Flow
          // ──────────────────────────────────────────────────────────
          const masterPassword2 = u2PasswordInput.value;
          if (!masterPassword2) {
            log('❌ Error: User 2 master password is required');
            return;
          }

          log('📝 STEP 1: User 2 (Bob) - Master password entered');
          const salt2 = crypto.getRandomValues(new Uint8Array(16));
          log('🧂 STEP 2: Generated random salt (16 bytes)');

          const kek2 = await deriveKEK(masterPassword2, salt2);
          log('🔑 STEP 3: KEK derived via PBKDF2');

          const keypair2 = await crypto.subtle.generateKey(
            { name: 'ECDH', namedCurve: 'P-256' },
            true,
            ['deriveKey']
          );
          const publicKeyJwk2 = await crypto.subtle.exportKey('jwk', keypair2.publicKey);
          const privateKeyJwk2 = await crypto.subtle.exportKey('jwk', keypair2.privateKey);
          log('🔐 STEP 4: ECDH keypair generated');

          const privateKeyJSON2 = JSON.stringify(privateKeyJwk2);
          const wrappedPrivateKey2 = await encryptPayload(privateKeyJSON2, kek2);
          log('🔒 STEP 5: Private key wrapped with KEK');

          const res2 = await fetch('/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              username: u2UsernameInput.value,
              salt: toBase64(salt2),
              publicKey: publicKeyJwk2,
              wrappedPrivateKey: wrappedPrivateKey2,
            }),
          });

          if (!res2.ok) {
            const errData = await res2.json();
            throw new Error(errData.error);
          }

          const data2 = await res2.json();
          state.user2.id = data2.userId;
          state.user2.salt = salt2;
          state.user2.kek = kek2;
          state.user2.publicKeyJwk = publicKeyJwk2;
          state.user2.privateKeyJwk = privateKeyJwk2;
          state.user2.wrappedPrivateKey = wrappedPrivateKey2;

          u2IdSpan.textContent = data2.userId;
          u2PasswordInput.disabled = true;
          u2UsernameInput.disabled = true;

          log(`✅ User 2 (Bob) registered: ${data2.userId}`);
          log('═══════════════════════════════════════════════════════\n');

        } catch (err) {
          log('❌ Error: ' + err.message);
          console.error(err);
        }
      });

      btnCreateSecret.addEventListener('click', async () => {
        try {
          if (!state.user1.id) { alert('Register first'); return; }
          log('📋 Creating secret...');
          const schemaType = schemaTypeSelect.value;
          const schemaRes = await fetch(`/schemas/${schemaType}`);
          const schema = await schemaRes.json();
          state.secretSchema = schema;
          log(`✅ Fetched schema: ${schemaType}`);
          openCreateSecretModal(schema, schemaType);
        } catch (err) {
          log('❌Error: ' + err.message);
        }
      });

      function openCreateSecretModal(schema, schemaType) {
        const modal = document.createElement('div');
        modal.className = 'modal-overlay';
        let formHTML = '<form style="display: flex; flex-direction: column; gap: 12px;">';
        const sortedFields = Object.entries(schema.properties).sort((a, b) => (a[1]['x-ui-order'] || 0) - (b[1]['x-ui-order'] || 0));
        for (const [fieldName, fieldDef] of sortedFields) {
          const isEnc = fieldDef['x-ui-encrypted'];
          const badge = isEnc ? '<span class="encrypted-badge">🔒 encrypted</span>' : '';
          const id = `field-${fieldName}`;
          formHTML += `<div class="form-group"><div class="form-label"><label for="${id}">${fieldDef.label}</label>${badge}</div>`;
          if (fieldDef['x-ui-type'] === 'select' && fieldDef.enum) {
            formHTML += `<select id="${id}"><option>--Select--</option>${fieldDef.enum.map(o => `<option value="${o}">${o}</option>`).join('')}</select>`;
          } else if (fieldDef['x-ui-type'] === 'textarea') {
            formHTML += `<textarea id="${id}"></textarea>`;
          } else {
            formHTML += `<input type="text" id="${id}" />`;
          }
          formHTML += '</div>';
        }
        formHTML += '</form>';
        modal.innerHTML = `<div class="modal"><h3>📝 Create: ${schemaType}</h3>${formHTML}<div class="modal-buttons"><button class="btn-secondary" onclick="this.closest('.modal-overlay').remove();">Cancel</button><button class="btn-primary" onclick="saveSecret('${schemaType}');">Save</button></div></div>`;
        document.body.appendChild(modal);

        // Populate with dummy data
        const dummyData = {
          loginCredentials: {
            ProviderName: 'Gmail',
            Website: 'https://mail.google.com',
            Username: 'alice@gmail.com',
            Password: 'SecurePass123!@#',
            '2FAMethod': 'Authenticator App',
            '2FADetails': 'JBSWY3DPEBLW64TMMQ======',
            Notes: 'Primary email account',
          },
          bankAccount: {
            AccountName: 'Savings Account',
            BankName: 'First Bank',
            AccountNumber: '9876543210',
            RoutingNumber: '021000021',
            PIN: '1234',
            Notes: 'Main savings',
          },
        };

        const data = dummyData[schemaType] || {};
        for (const [fieldName, value] of Object.entries(data)) {
          const el = document.getElementById(`field-${fieldName}`);
          if (el) {
            el.value = value;
          }
        }
      }

      async function saveSecret(schemaType) {
        try {
          const householdId = householdInput.value;
          const schema = state.secretSchema;
          
          // Step 1: Collect form data
          const secretData = {};
          for (const fieldName of Object.keys(schema.properties)) {
            const el = document.getElementById(`field-${fieldName}`);
            if (el) secretData[fieldName] = el.value;
          }
          log(`📋 Collected form data from user`);
          document.querySelector('.modal-overlay').remove();

          // Step 2: Generate DEK (one per secret)
          const dekRaw = generateDEK();
          const dekKey = await importDEK(dekRaw);
          log('✅ Generated DEK for this secret');

          // Step 3: Encrypt only sensitive fields (those marked x-ui-encrypted)
          log(`🔒 Encrypting sensitive fields...`);
          const encryptedFields = [];
          
          for (const [fieldName, fieldDef] of Object.entries(schema.properties)) {
            if (fieldDef['x-ui-encrypted']) {
              const plainValue = secretData[fieldName];
              const encryptedValue = await encryptField(plainValue, dekKey);
              secretData[fieldName] = encryptedValue; // Replace with base64 ciphertext
              encryptedFields.push(fieldName);
              log(`   🔐 Encrypted: ${fieldName}`);
            } else {
              log(`   ✓ Plaintext: ${fieldName}`);
            }
          }

          log(`\n📊 Final secret structure:`);
          for (const [fieldName, value] of Object.entries(secretData)) {
            const isEncrypted = encryptedFields.includes(fieldName);
            const preview = isEncrypted ? value.substring(0, 20) + '...' : value;
            log(`   ${fieldName}: ${isEncrypted ? '[ENCRYPTED]' : '[PLAINTEXT]'} ${preview}`);
          }

          // Step 4: Wrap DEK with KEK
          const wrappedDEK = await wrapDEKWithKEK(dekRaw, state.user1.kek);
          log('\n🔑 Wrapped DEK with KEK');

          // Step 5: Send to backend
          log(`\n📤 Sending to backend for schema validation...`);
          const createRes = await fetch('/vault/create', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              householdId,
              ownerId: state.user1.id,
              secretData, // Mix of plaintext + encrypted fields
              wrappedDEK,
              schemaType,
            }),
          });

          if (!createRes.ok) {
            const errData = await createRes.json();
            throw new Error(errData.error || 'Create failed');
          }

          const createData = await createRes.json();
          state.secretId = createData.itemId;
          secretIdSpan.textContent = createData.itemId;
          log(`✅ Secret created: ${createData.itemId}`);
          log(`✅ Backend validated plaintext fields against schema`);
          log(`✅ DEK wrapped and stored\n`);
          
          // Store secret data for viewing (but NOT the DEK key - fetch on-demand)
          state.secretData = secretData;

        } catch (err) {
          log('❌ Error: ' + err.message);
          console.error(err);
        }
      }

      btnViewSecret.addEventListener('click', async () => {
        try {
          if (!state.secretId) { alert('Create secret first'); return; }
          log('👁️ Viewing secret...\n');

          // Fetch from backend
          const accessRes = await fetch('/vault/access', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ itemId: state.secretId, userId: state.user1.id }),
          });
          
          if (!accessRes.ok) {
            const err = await accessRes.json();
            throw new Error(err.error);
          }

          const accessData = await accessRes.json();
          log('📥 Received secret data (wrappedDEK fetched on-demand)');

          // Store for field revelation later
          // NOTE: wrappedDEK is NOT fetched here - will be fetched on-demand from /vault/get-wrapped-dek after password verification
          state.secretData = accessData.secretData;
          state.secretSchema = accessData.schema;

          log(`📊 Secret structure (as stored):`);
          for (const [fieldName, value] of Object.entries(accessData.secretData)) {
            const schema = accessData.schema;
            const isEncrypted = schema.properties[fieldName]['x-ui-encrypted'];
            const preview = isEncrypted ? value.substring(0, 20) + '...' : value;
            log(`   ${fieldName}: ${isEncrypted ? '[ENCRYPTED]' : '[PLAINTEXT]'} ${preview}`);
          }

          log(`\n✅ Secret retrieved and ready to view\n`);
          renderSecretViewModal(accessData.schema, accessData.secretData);

        } catch (err) {
          log('❌ Error: ' + err.message);
          console.error(err);
        }
      });

      function renderSecretViewModal(schema, secretData) {
        const modal = document.createElement('div');
        modal.className = 'modal-overlay';
        modal.id = 'view-secret-modal';

        let formHTML = '<div style="display: flex; flex-direction: column; gap: 15px;">';
        
        const sortedFields = Object.entries(schema.properties)
          .sort((a, b) => (a[1]['x-ui-order'] || 0) - (b[1]['x-ui-order'] || 0));

        for (const [fieldName, fieldDef] of sortedFields) {
          const isEncrypted = fieldDef['x-ui-encrypted'];
          const value = secretData[fieldName];
          const label = fieldDef.label || fieldName;

          if (isEncrypted) {
            formHTML += `
              <div style="border: 1px solid #303a5e; padding: 10px; border-radius: 4px; background: rgba(79, 125, 255, 0.05);">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                  <label style="font-weight: bold; color: #ff6b6b;">🔒 ${label}</label>
                  <button class="btn-reveal-field" data-field="${fieldName}" 
                    style="padding: 5px 10px; background: #2196F3; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 12px;">
                    👁️ Reveal
                  </button>
                </div>
                <div id="field-${fieldName}" style="margin-top: 10px; padding: 10px; background: #0f1425; border-radius: 4px; font-family: monospace; font-size: 12px; color: #ff6b6b; border: 1px solid #303a5e;">
                  [Encrypted - Click to reveal]
                </div>
              </div>
            `;
          } else {
            formHTML += `
              <div style="border: 1px solid #303a5e; padding: 10px; border-radius: 4px;">
                <label style="display: block; font-weight: bold; margin-bottom: 5px; color: #a8d5ff;">${label}</label>
                <div id="field-${fieldName}" style="padding: 10px; background: #0f1425; border-radius: 4px; word-break: break-all; font-size: 13px;">
                  ${value || '(empty)'}
                </div>
              </div>
            `;
          }
        }

        formHTML += '</div>';

        modal.innerHTML = `
          <div class="modal">
            <h3>👁️ View Secret</h3>
            ${formHTML}
            <div class="modal-buttons">
              <button class="btn-secondary" onclick="document.getElementById('view-secret-modal').remove();">Close</button>
            </div>
          </div>
        `;

        document.body.appendChild(modal);

        // Attach reveal handlers
        document.querySelectorAll('.btn-reveal-field').forEach(btn => {
          btn.addEventListener('click', (e) => {
            const fieldName = e.target.getAttribute('data-field');
            openMasterPasswordModal(fieldName);
          });
        });
      }

      function openMasterPasswordModal(fieldName) {
        const modal = document.createElement('div');
        modal.id = 'master-password-modal';
        modal.style.cssText = `
          position: fixed;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          background: rgba(0,0,0,0.7);
          display: flex;
          align-items: center;
          justify-content: center;
          z-index: 2000;
        `;

        const fieldLabel = state.secretSchema.properties[fieldName].label || fieldName;

        modal.innerHTML = `
          <div style="
            background: #1a2847;
            padding: 30px;
            border-radius: 8px;
            width: 400px;
            border: 1px solid #262f4d;
          ">
            <h3 style="color: #f5f7ff; margin-bottom: 16px;">🔓 Unlock Field</h3>
            <p style="color: #8fa3cc; margin-bottom: 20px;">Required to view: <strong>${fieldLabel}</strong></p>
            <input type="password" id="modal-password" placeholder="Master password" 
              style="width: 100%; padding: 10px; border: 1px solid #303a5e; border-radius: 4px; box-sizing: border-box; margin-bottom: 10px; background: #0f1425; color: #f5f7ff;" 
              autofocus />
            <div id="modal-error" style="color: #ff6b6b; margin-bottom: 10px; font-size: 12px;"></div>
            <div style="display: flex; gap: 10px;">
              <button id="btn-verify-password" 
                style="flex: 1; padding: 10px; background: linear-gradient(135deg, #4f7dff, #8f67ff); color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: 600;">
                Verify
              </button>
              <button id="btn-cancel-password" 
                style="flex: 1; padding: 10px; background: #6a7a99; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: 600;">
                Cancel
              </button>
            </div>
          </div>
        `;

        document.body.appendChild(modal);
        state.currentRevealingField = fieldName;

        document.getElementById('btn-verify-password').addEventListener('click', async () => {
          await verifyAndDecryptField();
        });

        document.getElementById('btn-cancel-password').addEventListener('click', () => {
          modal.remove();
        });

        document.getElementById('modal-password').focus();
      }

      async function verifyAndDecryptField() {
        const masterPassword = document.getElementById('modal-password').value;
        const errorEl = document.getElementById('modal-error');
        const fieldName = state.currentRevealingField;

        if (!masterPassword) {
          errorEl.textContent = 'Enter your master password';
          return;
        }

        try {
          log(`\n🔑 Password verification for field: ${fieldName}`);
          
          // Step 1: Derive KEK from entered password + salt
          const derivedKEK = await deriveKEK(masterPassword, state.user1.salt);
          log(`✅ Step 1: KEK derived from password via PBKDF2`);

          // Step 2: CRITICAL - Verify password by unwrapping wrappedPrivateKey
          // wrappedPrivateKey is proof of password ownership
          // If password WRONG: derived KEK ≠ original KEK → AES-GCM decryption FAILS
          // If password CORRECT: derived KEK = original KEK → AES-GCM decryption SUCCEEDS
          log(`🔓 Step 2: Verifying password by unwrapping wrappedPrivateKey...`);
          let verifiedPrivateKey;
          try {
            verifiedPrivateKey = await decryptPayload(state.user1.wrappedPrivateKey, derivedKEK);
            log(`✅ Password VERIFIED - wrappedPrivateKey unwrapped successfully!`);
          } catch (unwrapErr) {
            throw new Error(`Invalid master password - verification failed`);
          }

          // Step 3: Password verified! Now fetch wrappedDEK from backend
          log(`📤 Step 3: Fetching wrappedDEK from backend (on-demand)...`);
          const dekResponse = await fetch('/vault/get-wrapped-dek', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              itemId: state.secretId,
              userId: state.user1.id,
            }),
          });

          if (!dekResponse.ok) {
            const errData = await dekResponse.json();
            throw new Error(errData.error || 'Failed to fetch wrapped DEK');
          }

          const dekData = await dekResponse.json();
          log(`✅ Received wrappedDEK from backend`);

          // Step 4: Unwrap DEK with verified KEK
          log(`🔓 Step 4: Unwrapping DEK with verified KEK...`);
          const dekRaw = await unwrapDEKWithKEK(dekData.wrappedDEK, derivedKEK);
          const dekKey = await importDEK(dekRaw);
          log(`✅ DEK unwrapped successfully`);
          // NOTE: DEK is NOT stored in state - only used locally for decryption

          // Step 5: Decrypt the field
          const encryptedValue = state.secretData[fieldName];
          log(`🔐 Step 5: Decrypting field...`);
          const decryptedValue = await decryptField(encryptedValue, dekKey);
          log(`✅ Field decrypted: ${fieldName}`);

          // Display decrypted value
          document.getElementById(`field-${fieldName}`).textContent = decryptedValue;
          document.getElementById(`field-${fieldName}`).style.color = '#a8d5ff';
          document.getElementById(`field-${fieldName}`).style.fontStyle = 'normal';

          log(`✅ Field revealed successfully (password verified, DEK not stored)\n`);

          document.getElementById('master-password-modal').remove();

        } catch (err) {
          console.error(err);
          errorEl.textContent = '❌ ' + err.message;
          log(`❌ Field reveal FAILED: ${err.message}\n`);
        }
      }

      btnShowState.addEventListener('click', async () => {
        try {
          const res = await fetch('/debug/state');
          const json = await res.json();
          log('📊 Server state:\n' + JSON.stringify(json, null, 2));
        } catch (err) {
          log('❌ Error: ' + err.message);
        }
      });
    </script>
  </body>
</html>
