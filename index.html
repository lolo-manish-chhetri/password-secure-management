  <body>
    <div class="container">
      <h1>🔐 Zero-Knowledge Vault</h1>
      <p class="subtitle">Field-level encryption with proper password verification</p>

      <div class="grid">
        <div class="card">
          <h2>Step 1: Register</h2>

            </div>

        <div class="card">

            <div><label>Household ID</label><input id="household-id" value="H1" /></div>
            <div><label>Secret Type</label><select id="schema-type"><option value="loginCredentials">Login Credentials</option><option value="bankAccount">Bank Account</option></select></div>
            <button id="btn-create-secret">Create Secret</button>

      <div class="card" style="width: 100%; margin-top: 20px;">
        <h2>Crypto Trace Log</h2>
        <div style="margin-top: 8px"><div class="pill"><span class="dot"></span><span>Proper password verification via DEK unwrapping</span></div></div>
        <pre id="log" class="log"></pre>
      </div>
    </div>

    <script>
      // ============================================================
      // Zero‑Knowledge Vault Demo (Frontend)
      //
      // High‑level responsibilities (mirrors the Notion doc):
      // - Flow 1: Onboarding – derive KEK (PBKDF2), generate ECDH keypair,
      //   wrap private key with KEK, send salt + publicKey + wrappedPrivateKey.
      // - Flow 2: Vault unlock – given master password, fetch salt +
      //   wrappedPrivateKey from backend, re‑derive KEK, unwrap private key
      //   and keep it in memory for this session only.
      // - Flow 3: Create secret – generate per‑secret DEK, encrypt only
      //   fields marked x‑ui‑encrypted, wrap DEK with owner public key,
      //   send secretData + wrappedDEK + schemaType.
      // - Flow 4: Share secret – owner unwraps DEK locally using their
      //   private key, re‑wraps DEK with recipient public key, backend
      //   stores an extra wrappedDEK for that user.
      // - Flow 5: Recipient view – recipient unlocks vault (Flow 2),
      //   fetches secretData + their wrappedDEK, unwraps DEK and decrypts
      //   encrypted fields on demand.
      // - Flow 6: Revoke access – owner deletes a recipient’s wrappedDEK,
      //   so they can no longer unwrap the DEK (no cryptographic access).
      // - Flow 7: Update secret – owner reuses the existing DEK to
      //   re‑encrypt updated fields; wrappedDEKs remain valid.
      //
      // This file is organized as:
      // 1. Crypto primitives (PBKDF2, AES‑GCM, ECDH).
      // 2. Frontend state + DOM wiring.
      // 3. Flow implementations (1‑7) in order.
      // 4. Sharing / access‑request / revoke helpers.
      // 5. Debug helpers (server state).
      // ============================================================

      // === 1. Crypto primitives (PBKDF2, AES‑GCM, ECDH) ===

      const encoder = new TextEncoder();
      const decoder = new TextDecoder();
      const IV_LENGTH = 12;
      const ITERATIONS = 600000;

      const logEl = document.getElementById('log');
      function log(msg) {
        const ts = new Date().toISOString().split('T')[1].replace('Z', '');
        logEl.textContent += `[${ts}] ${msg}\n`;
        logEl.scrollTop = logEl.scrollHeight;
      }

      function toBase64(bytes) {
        let binary = '';
        for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
        return btoa(binary);
      }

      function fromBase64(base64) {
        const binary = atob(base64);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
        return bytes;
      }

      function pack(iv, ciphertext) {
        const packed = new Uint8Array(iv.length + ciphertext.byteLength);
        packed.set(iv, 0);
        packed.set(new Uint8Array(ciphertext), iv.length);
        return packed;
      }

      function unpack(packed) {
        return { iv: packed.slice(0, IV_LENGTH), ciphertext: packed.slice(IV_LENGTH) };
      }

      async function deriveKEK(password, saltBytes) {
        const keyMaterial = await crypto.subtle.importKey('raw', encoder.encode(password), 'PBKDF2', false, ['deriveKey']);
        return crypto.subtle.deriveKey(
          { name: 'PBKDF2', salt: saltBytes, iterations: ITERATIONS, hash: 'SHA-256' },
          keyMaterial,
          { name: 'AES-GCM', length: 256 },
          false,
          ['encrypt', 'decrypt']
        );
      }

      function generateDEK() {
        return crypto.getRandomValues(new Uint8Array(32));
      }

      async function importDEK(dekRaw) {
        return crypto.subtle.importKey('raw', dekRaw, { name: 'AES-GCM' }, false, ['encrypt', 'decrypt']);
      }
      async function encryptField(fieldValue, dekKey) {
        const iv = crypto.getRandomValues(new Uint8Array(IV_LENGTH));
        const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, dekKey, encoder.encode(String(fieldValue)));
        return toBase64(pack(iv, ct));
      }

      async function decryptField(encryptedFieldB64, dekKey) {
        const packed = fromBase64(encryptedFieldB64);
        const { iv, ciphertext } = unpack(packed);
        const ptBuf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, dekKey, ciphertext);
        return decoder.decode(ptBuf);
      }

      async function encryptPayload(plaintext, dekKey) {
        const iv = crypto.getRandomValues(new Uint8Array(IV_LENGTH));
        const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, dekKey, encoder.encode(plaintext));
        return toBase64(pack(iv, ct));
      }

      async function decryptPayload(encryptedB64, dekKey) {
        const packed = fromBase64(encryptedB64);
        const { iv, ciphertext } = unpack(packed);
        const ptBuf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, dekKey, ciphertext);
        return decoder.decode(ptBuf);
      }

      // ECDH-based DEK wrapping for sharing (asymmetric)
      // Clean JWK: remove 'use' and 'key_ops' fields that might conflict with different algorithms
      function cleanJWK(jwk) {
        const cleaned = { ...jwk };
        delete cleaned.use;        // Remove algorithm restriction (e.g., "sig")
        delete cleaned.key_ops;    // Remove operation restrictions
        return cleaned;
      }

      // Wrap DEK using ECIES (ephemeral ECDH + AES-256-GCM).
      // Doc intent: "Public key encrypts DEKs" — only the recipient's public key is
      // needed to wrap. A fresh ephemeral keypair is generated per wrap operation.
      // Packed output format: ephemeralPublicKey (65 bytes, uncompressed P-256 point)
      //                       + IV (12 bytes) + AES-GCM ciphertext
      // The unwrapper reads the ephemeral public key from the blob — no sender
      // identity is required or encoded.
      async function wrapDEKWithPublicKey(dekRaw, recipientPublicKeyJwk) {
        try {
          // Import recipient's long-term public key
          const recipientPublicKey = await crypto.subtle.importKey(
            'jwk',
            cleanJWK(recipientPublicKeyJwk),
            { name: 'ECDH', namedCurve: 'P-256' },
            false,
            []
          );

          // Generate a fresh ephemeral keypair for this wrap operation only
          const ephemeralKeypair = await crypto.subtle.generateKey(
            { name: 'ECDH', namedCurve: 'P-256' },
            true,
            ['deriveBits']
          );

          // ECDH: ephemeralPrivate × recipientPublic → shared secret
          const sharedSecret = await crypto.subtle.deriveBits(
            { name: 'ECDH', public: recipientPublicKey },
            ephemeralKeypair.privateKey,
            256
          );

          const encryptionKey = await crypto.subtle.importKey(
            'raw',
            sharedSecret,
            { name: 'AES-GCM' },
            false,
            ['encrypt']
          );

          // Encrypt DEK
          const iv = crypto.getRandomValues(new Uint8Array(IV_LENGTH));
          const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, encryptionKey, dekRaw);

          // Pack: ephemeral public key (65 bytes raw) + IV + ciphertext
          const ephemeralPubRaw = await crypto.subtle.exportKey('raw', ephemeralKeypair.publicKey);
          const ephemeralPubBytes = new Uint8Array(ephemeralPubRaw); // 65 bytes uncompressed
          const packed = new Uint8Array(ephemeralPubBytes.length + iv.length + ct.byteLength);
          packed.set(ephemeralPubBytes, 0);
          packed.set(iv, ephemeralPubBytes.length);
          packed.set(new Uint8Array(ct), ephemeralPubBytes.length + iv.length);
          return toBase64(packed);
        } catch (err) {
          throw new Error(`ECIES wrapping failed: ${err.message}`);
        }
      }

      // Unwrap DEK using ECIES — only my private key is needed.
      // The ephemeral public key is read from the packed blob (first 65 bytes).
      // No sender identity / owner public key required.
      async function unwrapDEKWithPrivateKey(wrappedDEKB64, myPrivateKeyJwk) {
        try {
          const packedBytes = fromBase64(wrappedDEKB64);

          // Unpack: ephemeral public key (65 bytes) + IV (12 bytes) + ciphertext
          const EPHEMERAL_PUB_LENGTH = 65; // uncompressed P-256 point
          const ephemeralPubBytes = packedBytes.slice(0, EPHEMERAL_PUB_LENGTH);
          const iv = packedBytes.slice(EPHEMERAL_PUB_LENGTH, EPHEMERAL_PUB_LENGTH + IV_LENGTH);
          const ciphertext = packedBytes.slice(EPHEMERAL_PUB_LENGTH + IV_LENGTH);

          // Import ephemeral public key from raw bytes in the blob
          const ephemeralPublicKey = await crypto.subtle.importKey(
            'raw',
            ephemeralPubBytes,
            { name: 'ECDH', namedCurve: 'P-256' },
            false,
            []
          );

          // Import my private key
          const myPrivateKey = await crypto.subtle.importKey(
            'jwk',
            cleanJWK(myPrivateKeyJwk),
            { name: 'ECDH', namedCurve: 'P-256' },
            false,
            ['deriveBits']
          );

          // ECDH: myPrivate × ephemeralPublic → same shared secret as wrap
          const sharedSecret = await crypto.subtle.deriveBits(
            { name: 'ECDH', public: ephemeralPublicKey },
            myPrivateKey,
            256
          );

          const decryptionKey = await crypto.subtle.importKey(
            'raw',
            sharedSecret,
            { name: 'AES-GCM' },
            false,
            ['decrypt']
          );

          const dekRaw = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, decryptionKey, ciphertext);
          return new Uint8Array(dekRaw);
        } catch (err) {
          throw new Error(`ECIES unwrapping failed: ${err.message}`);
        }
      }

      const state = {
        user1: { id: null, salt: null, kek: null, wrappedPrivateKey: null, publicKeyJwk: null, privateKeyJwk: null },
        user2: { id: null, salt: null, kek: null, wrappedPrivateKey: null, publicKeyJwk: null, privateKeyJwk: null },
        currentUser: null,  // Currently logged-in user (user1 or user2)
        secretId: null,
        secretSchema: null,
        secretData: null,
        wrappedDEK: null,
        currentDEKKey: null,
        currentRevealingField: null,
      };

      const u1UsernameInput = document.getElementById('u1-username');
      const u1PasswordInput = document.getElementById('u1-password');
      const u2UsernameInput = document.getElementById('u2-username');
      const u2PasswordInput = document.getElementById('u2-password');
      const u1IdSpan = document.getElementById('u1-id');
      const u2IdSpan = document.getElementById('u2-id');
      const householdInput = document.getElementById('household-id');
      const schemaTypeSelect = document.getElementById('schema-type');
      const secretIdSpan = document.getElementById('secret-id');
      const btnRegister = document.getElementById('btn-register');
      const btnCreateSecret = document.getElementById('btn-create-secret');
      const btnViewSecret = document.getElementById('btn-view-secret');
      const btnShowState = document.getElementById('btn-show-state');
      const currentUserSelect = document.getElementById('current-user-select');
      const currentUserInfo = document.getElementById('current-user-info');
      const currentUserIdEl = document.getElementById('current-user-id');
      const currentUserNameEl = document.getElementById('current-user-name');

      // FLOW 2: Vault unlock (Session)
      // Mirrors doc Flow 2:
      // - Frontend: user enters master password, we call backend to get
      //   salt + wrappedPrivateKey, then derive KEK and unwrap the private
      //   key in memory for this session.
      // - Backend: simply returns what was stored at onboarding
      //   (salt, wrappedPrivateKey, publicKey) – still no KEK or plaintext.
      //
      // This helper is used by verifyAndDecryptField to bootstrap Flow 2.
      // Helper: fetch salt + wrappedPrivateKey + publicKey for Flow 2 (vault unlock)
      async function fetchUnlockBootstrap(userId) {
        const res = await fetch('/vault/unlock-bootstrap', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ userId }),
        });

        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.error || 'Failed to fetch unlock data');
        }

        return res.json();
      }

      // Open edit secret modal (owner-only – uses existing schema and secretData)
      function openEditSecretModal() {
        const schema = state.secretSchema;
        const secretData = state.secretData;

        if (!schema || !secretData) {
          alert('No secret loaded to edit');
          return;
        }

        const modal = document.createElement('div');
        modal.id = 'edit-secret-modal';
        modal.className = 'modal-overlay';

        let formHTML = '<div style="display: flex; flex-direction: column; gap: 15px;">';

        const sortedFields = Object.entries(schema.properties)
          .sort((a, b) => (a[1]['x-ui-order'] || 0) - (b[1]['x-ui-order'] || 0));

        for (const [fieldName, fieldDef] of sortedFields) {
          const isEncrypted = fieldDef['x-ui-encrypted'];
          const label = fieldDef.label || fieldName;
          const currentValue = secretData[fieldName];
          const id = `edit-field-${fieldName}`;

          formHTML += `
            <div class="form-group">
              <div class="form-label">
                <label for="${id}">${label}</label>
                ${isEncrypted ? '<span class="encrypted-badge">🔒 encrypted – leave blank to keep existing</span>' : ''}
              </div>
          `;

          if (fieldDef['x-ui-type'] === 'select' && fieldDef.enum && !isEncrypted) {
            formHTML += `<select id="${id}">
              ${fieldDef.enum.map(o => `<option value="${o}" ${currentValue === o ? 'selected' : ''}>${o}</option>`).join('')}
            </select>`;
          } else if (fieldDef['x-ui-type'] === 'textarea') {
            formHTML += `<textarea id="${id}">${!isEncrypted ? (currentValue || '') : ''}</textarea>`;
          } else {
            const valueAttr = !isEncrypted ? (currentValue || '') : '';
            const placeholder = isEncrypted ? '[unchanged]' : '';
            formHTML += `<input type="text" id="${id}" value="${valueAttr}" placeholder="${placeholder}" />`;
          }

          formHTML += '</div>';
        }

        formHTML += `
          <div class="form-group">
            <div class="form-label">
              <label for="edit-master-password">Master password</label>
            </div>
            <input type="password" id="edit-master-password" placeholder="Required to re-encrypt sensitive fields" />
            <div id="edit-secret-error" class="error-message"></div>
          </div>
        `;

        modal.innerHTML = `
          <div class="modal">
            <h3>✏️ Edit Secret</h3>
            ${formHTML}
            <div class="modal-buttons">
              <button class="btn-secondary" id="btn-cancel-edit">Cancel</button>
              <button class="btn-primary" id="btn-save-edit">Save changes</button>
            </div>
          </div>
        `;

        document.body.appendChild(modal);

        document.getElementById('btn-cancel-edit').addEventListener('click', () => {
          document.getElementById('edit-secret-modal')?.remove();
        });

        document.getElementById('btn-save-edit').addEventListener('click', async () => {
          await saveEditedSecret();
        });
      }

      // Handle user selection
      currentUserSelect.addEventListener('change', (e) => {
        const selectedUser = e.target.value;
        if (selectedUser === 'user1') {
          state.currentUser = state.user1;
          currentUserIdEl.textContent = state.user1.id;
          currentUserNameEl.textContent = u1UsernameInput.value;
          currentUserInfo.style.display = 'block';
          log(`\n👤 Switched to User 1: ${state.user1.id} (${u1UsernameInput.value})\n`);
        } else if (selectedUser === 'user2') {
          state.currentUser = state.user2;
          currentUserIdEl.textContent = state.user2.id;
          currentUserNameEl.textContent = u2UsernameInput.value;
          currentUserInfo.style.display = 'block';
          log(`\n👤 Switched to User 2: ${state.user2.id} (${u2UsernameInput.value})\n`);
        } else {
          state.currentUser = null;
          currentUserInfo.style.display = 'none';
          log('\n👤 No user selected\n');
        }
      });

      // FLOW 1: User Onboarding (Master Password Setup)
      // Mirrors doc Flow 1:
      // - Frontend: user enters master password, we generate salt,

      // FLOW 3: Create secret (Owner)
      // Mirrors doc Flow 3:
      // - Frontend: generate a random per‑secret DEK, encrypt only fields
      //   marked x‑ui‑encrypted with AES‑GCM using that DEK, then wrap the
      //   DEK with the owner’s public key (ECDH → AES‑GCM). Send the mixed
      //   plaintext/ciphertext secretData plus wrappedDEK + schemaType.
      // - Backend: validates plaintext against the schema, stores the
      //   secretData and the owner wrappedDEK (in-memory for this POC).
      //   Step 4 (policy check) + Step 5 (wrap loop) + Step 6 (send) implemented below.
      async function saveSecret(schemaType) {
        try {
          const householdId = householdInput.value;
          const schema = state.secretSchema;
          
          // Step 1: Collect form data
          const secretData = {};
          for (const fieldName of Object.keys(schema.properties)) {
            const el = document.getElementById(`field-${fieldName}`);
            if (el) secretData[fieldName] = el.value;
          }
          log(`📋 Collected form data from user`);
          document.querySelector('.modal-overlay').remove();

          // Step 2: Generate DEK (one per secret)
          const dekRaw = generateDEK();
          const dekKey = await importDEK(dekRaw);
          log('✅ Generated DEK for this secret');

          // Step 3: Encrypt only sensitive fields (those marked x-ui-encrypted)
          log(`🔒 Encrypting sensitive fields...`);
          const encryptedFields = [];
          
          for (const [fieldName, fieldDef] of Object.entries(schema.properties)) {
            if (fieldDef['x-ui-encrypted']) {
              const plainValue = secretData[fieldName];
              const encryptedValue = await encryptField(plainValue, dekKey);
              secretData[fieldName] = encryptedValue; // Replace with base64 ciphertext
              encryptedFields.push(fieldName);
              log(`   🔐 Encrypted: ${fieldName}`);
            } else {
              log(`   ✓ Plaintext: ${fieldName}`);
            }
          }

          log(`\n📊 Final secret structure:`);
          for (const [fieldName, value] of Object.entries(secretData)) {
            const isEncrypted = encryptedFields.includes(fieldName);
            const preview = isEncrypted ? value.substring(0, 20) + '...' : value;
            log(`   ${fieldName}: ${isEncrypted ? '[ENCRYPTED]' : '[PLAINTEXT]'} ${preview}`);
          }

          // Step 4: Policy check — fetch public keys of all default-access users.
          // Doc: "Who gets default access? Fetch Co-Owner's public key, wrap DEK for each."
          // In this demo the policy resolves to owner only. In production, a
          // /vault/default-access-users endpoint would return all trust-level
          // members (Co-Owner, etc.) who should receive a wrapped DEK at create time.
          log(`\n🔑 Step 4: Policy check — fetching default-access user public keys...`);
          const ownerKeyRes = await fetch(`/users/${state.currentUser.id}/public-key`);
          if (!ownerKeyRes.ok) throw new Error('Failed to fetch owner public key');
          const ownerKeyData = await ownerKeyRes.json();

          // defaultAccessUsers = [{ userId, publicKey }]
          // Extend this array with Co-owner / household members in production.
          const defaultAccessUsers = [
            { userId: ownerKeyData.userId, publicKey: ownerKeyData.publicKey },
          ];
          log(`   Policy resolved ${defaultAccessUsers.length} user(s): [${defaultAccessUsers.map(u => u.userId).join(', ')}]`);

          // Step 5: Wrap DEK for each default-access user (envelope encryption loop).
          // Doc: "Wrap DEK with each user's public key" — one wrappedDEK entry per user.
          log(`\n🔐 Step 5: Wrapping DEK for each default-access user...`);
          const wrappedDEKEntries = [];
          for (const { userId, publicKey } of defaultAccessUsers) {
            const wrappedDEKForUser = await wrapDEKWithPublicKey(
              dekRaw,
              publicKey  // recipient's public key — ECIES, no sender private key needed
            );
            wrappedDEKEntries.push({ userId, wrappedDEK: wrappedDEKForUser });
            log(`   Wrapped DEK for: ${userId}`);
          }

          // Extract owner's wrapped copy — /vault/create contract expects single wrappedDEK string.
          const ownerEntry = wrappedDEKEntries.find(e => e.userId === state.currentUser.id);
          const wrappedDEK = ownerEntry.wrappedDEK;

          // Step 6: Send to backend
          log(`\n📤 Step 6: Sending to backend for schema validation...`);
          log(`   Wrapped DEKs generated: ${wrappedDEKEntries.length} — sending owner copy to /vault/create`);
          const createRes = await fetch('/vault/create', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              householdId,
              ownerId: state.currentUser.id,
              secretData, // Mix of plaintext + encrypted fields
              wrappedDEK,
              schemaType,
            }),
          });

          if (!createRes.ok) {
            const errData = await createRes.json();
            throw new Error(errData.error || 'Create failed');
          }

          const createData = await createRes.json();
          state.secretId = createData.itemId;
          secretIdSpan.textContent = createData.itemId;
          log(`✅ Secret created: ${createData.itemId}`);
          log(`✅ Backend validated plaintext fields against schema`);
          log(`✅ DEK wrapped and stored for ${wrappedDEKEntries.length} user(s)\n`);
          
          // Store secret data for viewing (but NOT the DEK key - fetch on-demand)
          state.secretData = secretData;

        } catch (err) {
          log('❌ Error: ' + err.message);
          console.error(err);
        }
      }

          await verifyAndDecryptField();
        });

        document.getElementById('btn-cancel-password').addEventListener('click', () => {
          modal.remove();
        });

        document.getElementById('modal-password').focus();
      }

      // FLOW 2 (continued) + part of Flow 5:
      // - Implements password verification via wrappedPrivateKey unwrapping
      //   and then field‑level decryption for a single encrypted field.
      // - This is where we actually run PBKDF2(password + salt) → KEK,
      //   unwrap the private key (Flow 2), then fetch and unwrap the DEK
      //   for the current user and decrypt one field (Flow 5).
      async function verifyAndDecryptField() {
        const masterPassword = document.getElementById('modal-password').value;
        const errorEl = document.getElementById('modal-error');
        const fieldName = state.currentRevealingField;

        if (!masterPassword) {
          errorEl.textContent = 'Enter your master password';
          return;
        }

        try {
          log(`\n🔑 Password verification for field: ${fieldName}`);
          
          // Step 1: Fetch salt + wrappedPrivateKey from backend (Flow 2 unlock bootstrap)
          log(`📥 Step 1: Fetching salt + wrappedPrivateKey from backend...`);
          const unlockData = await fetchUnlockBootstrap(state.currentUser.id);

          // Step 2: Derive KEK from entered password + salt
          const saltBytes = fromBase64(unlockData.salt);
          const derivedKEK = await deriveKEK(masterPassword, saltBytes);
          log(`✅ Step 2: KEK derived from password via PBKDF2`);

          // Step 3: CRITICAL - Verify password by unwrapping wrappedPrivateKey
          // wrappedPrivateKey is proof of password ownership
          // If password WRONG: derived KEK ≠ original KEK → AES-GCM decryption FAILS
          // If password CORRECT: derived KEK = original KEK → AES-GCM decryption SUCCEEDS
          log(`🔓 Step 3: Verifying password by unwrapping wrappedPrivateKey...`);
          let verifiedPrivateKey;
          try {
            verifiedPrivateKey = await decryptPayload(unlockData.wrappedPrivateKey, derivedKEK);
            log(`✅ Password VERIFIED - wrappedPrivateKey unwrapped successfully!`);
          } catch (unwrapErr) {
            throw new Error(`Invalid master password - verification failed`);
          }

          // Step 4: Password verified! Now fetch wrappedDEK from backend
          log(`📤 Step 4: Fetching wrappedDEK from backend (on-demand)...`);
          const dekResponse = await fetch('/vault/get-wrapped-dek', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              itemId: state.secretId,
              userId: state.currentUser.id,
            }),
          });

          if (!dekResponse.ok) {
            const errData = await dekResponse.json();
            
            // Handle "No access" case inline in the unlock modal
            if (dekResponse.status === 401) {
              log(`⚠️ No access to encrypted fields`);
              log(`   You can request access from the owner\n`);

              const modalError = document.getElementById('modal-error');
              const verifyBtn = document.getElementById('btn-verify-password');
              const passwordInput = document.getElementById('modal-password');

              // Clear password input – no need after access check
              if (passwordInput) passwordInput.value = '';

              // Inform user they lack access
              if (modalError) {
                modalError.textContent = 'You do not have access to view this field. You can request access from the owner.';
              }

              // Turn "Verify" into "Request access" button
              if (verifyBtn) {
                verifyBtn.textContent = 'Request access';
                verifyBtn.onclick = async () => {
                  try {
                    log(`\n📬 Sending access request...`);
                    const reqRes = await fetch('/vault/request-access', {
                      method: 'POST',
                      headers: { 'Content-Type': 'application/json' },
                      body: JSON.stringify({
                        itemId: state.secretId,
                        userId: state.currentUser.id,
                      }),
                    });

                    if (!reqRes.ok) {
                      const reqErr = await reqRes.json();
                      throw new Error(reqErr.error || 'Request failed');
                    }

                    log(`✅ Access request sent to owner\n`);
                    document.getElementById('master-password-modal')?.remove();
                  } catch (reqErr) {
                    log(`❌ Request failed: ${reqErr.message}\n`);
                    if (modalError) {
                      modalError.textContent = '❌ ' + reqErr.message;
                    }
                    console.error(reqErr);
                  }
                };
              }

              return;
            }

            throw new Error(errData.error || 'Failed to fetch DEK');
          }

          const dekData = await dekResponse.json();
          const dekRaw = await unwrapDEKWithPrivateKey(
            dekData.wrappedDEK,
            state.currentUser.privateKeyJwk  // ECIES: ephemeral pub key read from blob
          );
          const dekKey = await importDEK(dekRaw);
          log(`✅ DEK unwrapped successfully`);
          // NOTE: DEK is NOT stored in state - only used locally for decryption

          // Step 5: Decrypt the field
          const encryptedValue = state.secretData[fieldName];
          log(`🔐 Step 5: Decrypting field...`);
          const decryptedValue = await decryptField(encryptedValue, dekKey);
          log(`✅ Field decrypted: ${fieldName}`);

          // Display decrypted value
          document.getElementById(`field-${fieldName}`).textContent = decryptedValue;
          document.getElementById(`field-${fieldName}`).style.color = '#a8d5ff';
          document.getElementById(`field-${fieldName}`).style.fontStyle = 'normal';

          log(`✅ Field revealed successfully (password verified, DEK not stored)\n`);

          document.getElementById('master-password-modal').remove();

        } catch (err) {
          console.error(err);
          errorEl.textContent = '❌ ' + err.message;
          log(`❌ Field reveal FAILED: ${err.message}\n`);
        }
      }

      // FLOW 7: Update secret (reuse existing DEK)
      // Mirrors the Option A update flow:
      // - Frontend: owner re‑verifies their password, unwraps their
      //   wrappedDEK to recover the existing per‑secret DEK, and uses that
      //   same DEK to re‑encrypt any changed encrypted fields. Encrypted
      //   fields left blank keep their old ciphertext.
      // - Backend: /vault/update only overwrites secretData; it does not
      //   touch wrappedDEKs, so all existing per‑user wrapped DEKs stay
      //   valid and can still unwrap the same DEK for the updated secret.
      // Save edited secret – reuse existing DEK so wrappedDEKs stay valid
      async function saveEditedSecret() {
        const errorEl = document.getElementById('edit-secret-error');
        const masterPassword = document.getElementById('edit-master-password').value;

        if (!masterPassword) {
          if (errorEl) errorEl.textContent = 'Enter your master password';
          return;
        }

        try {
          if (!state.currentUser || !state.secretId || !state.secretSchema || !state.secretData) {
            throw new Error('Missing secret or user context');
          }

          log('\n✏️ Updating secret with existing DEK...');

          // Step 1: Verify master password by unwrapping wrappedPrivateKey
          log('🔑 Step 1: Verifying master password...');
          const derivedKEK = await deriveKEK(masterPassword, state.currentUser.salt);
          try {
            await decryptPayload(state.currentUser.wrappedPrivateKey, derivedKEK);
            log('✅ Password VERIFIED for update');
          } catch (e) {
            throw new Error('Invalid master password - update aborted');
          }

          // Step 2: Fetch owner wrappedDEK
          log('📤 Step 2: Fetching owner wrappedDEK...');
          const dekFetchRes = await fetch('/vault/get-wrapped-dek', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              itemId: state.secretId,
              userId: state.currentUser.id,
            }),
          });

          if (!dekFetchRes.ok) {
            const err = await dekFetchRes.json();
            throw new Error(err.error || 'Failed to fetch wrapped DEK for update');
          }

          const dekData = await dekFetchRes.json();

          // Step 3: Unwrap DEK using owner's private key (ECIES: ephemeral pub key is in the blob)
          log('🔓 Step 3: Unwrapping DEK with owner private key...');
          const dekRaw = await unwrapDEKWithPrivateKey(
            dekData.wrappedDEK,
            state.currentUser.privateKeyJwk
          );
          const dekKey = await importDEK(dekRaw);
          log('✅ DEK unwrapped for update (reusing existing DEK)');

          // Step 4: Build updated secretData (reuse ciphertext when encrypted fields left blank)
          const schema = state.secretSchema;
          const updatedSecretData = {};

          for (const [fieldName, fieldDef] of Object.entries(schema.properties)) {
            const isEncrypted = fieldDef['x-ui-encrypted'];
            const el = document.getElementById(`edit-field-${fieldName}`);
            const inputValue = el ? el.value : '';

            if (isEncrypted) {
              if (!inputValue) {
                // Keep existing ciphertext if left blank
                updatedSecretData[fieldName] = state.secretData[fieldName];
                log(`   🔁 Kept existing ciphertext for ${fieldName}`);
              } else {
                const encryptedValue = await encryptField(inputValue, dekKey);
                updatedSecretData[fieldName] = encryptedValue;
                log(`   🔐 Re-encrypted field: ${fieldName}`);
              }
            } else {
              updatedSecretData[fieldName] = inputValue;
              log(`   ✏️ Updated plaintext field: ${fieldName}`);
            }
          }

          // Step 5: Send update to backend (DEK + wrappedDEKs unchanged)
          log('📤 Step 5: Sending updated secret to backend...');
          const updateRes = await fetch('/vault/update', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              itemId: state.secretId,
              ownerId: state.currentUser.id,
              secretData: updatedSecretData,
            }),
          });

          if (!updateRes.ok) {
            const err = await updateRes.json();
            throw new Error(err.error || 'Update failed');
          }

          const updateData = await updateRes.json();
          log(`✅ Secret updated (itemId: ${updateData.itemId}) – DEK reused, wrappedDEKs unchanged\n`);

          // Update local state and close modal
          state.secretData = updatedSecretData;
          document.getElementById('edit-secret-modal')?.remove();
        } catch (err) {
          console.error(err);
          if (errorEl) errorEl.textContent = '❌ ' + err.message;
          log(`❌ Secret update FAILED: ${err.message}\n`);
        }
      }

      btnShowState.addEventListener('click', async () => {
        try {
          const res = await fetch('/debug/state');
          const json = await res.json();
          log('📊 Server state:\n' + JSON.stringify(json, null, 2));
        } catch (err) {
          log('❌ Error: ' + err.message);
        }
      });

      // Add references to new buttons
      const btnCheckRequests = document.getElementById('btn-check-requests');
      const btnShareSecret = document.getElementById('btn-share-secret');
      const btnRevokeAccess = document.getElementById('btn-revoke-access');

      // Check for pending access requests (owner view)
      btnCheckRequests.addEventListener('click', async () => {
        try {
          if (!state.secretId) { alert('Create secret first'); return; }
          log('\n📬 Checking pending requests...');
          
          const reqRes = await fetch('/vault/pending-requests', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ itemId: state.secretId, ownerId: state.currentUser.id }),
          });

          if (!reqRes.ok) {
            const err = await reqRes.json();
            throw new Error(err.error);
          }

          const reqData = await reqRes.json();
          log(`✅ Found ${reqData.count} pending request(s)\n`);

          if (reqData.count === 0) {
            log('No pending requests');
            return;
          }

          for (const req of reqData.requests) {
            log(`   📥 ${req.username} (${req.userId}) - Requested: ${new Date(req.requestedAt).toLocaleString()}`);
          }
          log('');

          showPendingRequestsModal(state.secretId, reqData.requests);
        } catch (err) {
          log('❌ Error: ' + err.message);
          console.error(err);
        }
      });

      // FLOW 4: Share secret (key sharing between people)
      // Mirrors doc Flow 4:
      // - Frontend: owner’s private key is already in memory from Flow 2.
      //   To share, we fetch the owner’s wrappedDEK, unwrap the DEK with
      //   their private key, fetch the recipient’s public key and re‑wrap
      //   the same DEK for the recipient. The UI entry here is a simple
      //   “Share with User 2” button for the demo.
      // - Backend: stores an extra wrappedDEK entry for the recipient in
      //   wrappedDEKs[itemId][recipientUserId], similar to secret_access.
      // Share secret with User 2 (owner approves)
      btnShareSecret.addEventListener('click', async () => {
        try {
          if (!state.secretId) { alert('Create secret first'); return; }
          if (!state.user2.id) { alert('Register User 2 first'); return; }
          
          log('\n🔐 Sharing secret with Jason...');
          log(`   Secret: ${state.secretId}`);
          log(`   Owner: manish (${state.user1.id})`);
          log(`   Recipient: jason (${state.user2.id})\n`);
          
          showShareApprovalModal(state.secretId, state.user2.id);
        } catch (err) {
          log('❌ Error: ' + err.message);
          console.error(err);
        }
      });

      // FLOW 6: Revoke access
      // Mirrors doc Flow 6:
      // - Frontend: owner opens a revoke dialog that lists secrets they
      //   own and all users who currently have a wrappedDEK for each
      //   secret. Clicking “×” next to a user/secret calls revokeAccess.
      // - Backend: /vault/revoke-access deletes the wrappedDEK for that
      //   (itemId, userId) pair. Without a wrappedDEK a user can no longer
      //   unwrap the DEK, so they lose cryptographic access even if they
      //   still see ciphertext.
      // Revoke access (owner) – open modal listing secrets and users
      btnRevokeAccess.addEventListener('click', async () => {
        try {
          if (!state.currentUser) {
            alert('Select an owner user first');
            return;
          }
          await openRevokeAccessModal();
        } catch (err) {
          console.error(err);
        }
      });

      // Show pending requests modal
      function showPendingRequestsModal(itemId, requests) {
        const modal = document.createElement('div');
        modal.className = 'modal-overlay';
        modal.id = 'pending-requests-modal';

        let requestsHTML = '<div style="display: flex; flex-direction: column; gap: 10px;">';
        for (const req of requests) {
          requestsHTML += `
            <div style="border: 1px solid #303a5e; padding: 10px; border-radius: 4px;">
              <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                <label style="font-weight: bold; color: #a8d5ff;">${req.username}</label>
                <small style="color: #8fa3cc;">${new Date(req.requestedAt).toLocaleString()}</small>
              </div>
              <button class="btn-approve" data-user-id="${req.userId}" 
                style="padding: 8px 12px; background: #4CAF50; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: 600;">
                ✅ Approve
              </button>
            </div>
          `;
        }
        requestsHTML += '</div>';

        modal.innerHTML = `
          <div class="modal">
            <h3>📬 Pending Access Requests</h3>
            ${requestsHTML}
            <div class="modal-buttons">
              <button class="btn-secondary" onclick="document.getElementById('pending-requests-modal').remove();">Close</button>
            </div>
          </div>
        `;

        document.body.appendChild(modal);

        // Add approve handlers
        document.querySelectorAll('.btn-approve').forEach(btn => {
          btn.addEventListener('click', async (e) => {
            const requesterUserId = e.target.getAttribute('data-user-id');
            showShareApprovalModal(itemId, requesterUserId);
            document.getElementById('pending-requests-modal').remove();
          });
        });
      }

      // Show approval modal (owner enters password, then shares)
      function showShareApprovalModal(itemId, recipientUserId) {
        const modal = document.createElement('div');
        modal.id = 'share-approval-modal';
        modal.style.cssText = `
          position: fixed;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          background: rgba(0,0,0,0.7);
          display: flex;
          align-items: center;
          justify-content: center;
          z-index: 2000;
        `;

        const recipientName = recipientUserId === state.user2.id ? state.user2.id : 'User';

        modal.innerHTML = `
          <div style="
            background: #1a2847;
            padding: 30px;
            border-radius: 8px;
            width: 400px;
            border: 1px solid #262f4d;
          ">
            <h3 style="color: #f5f7ff; margin-bottom: 16px;">🤝 Share Secret</h3>
            <p style="color: #8fa3cc; margin-bottom: 20px;">Enter your master password to approve sharing this secret with <strong>${recipientName}</strong></p>
            <input type="password" id="share-password" placeholder="Master password" 
              style="width: 100%; padding: 10px; border: 1px solid #303a5e; border-radius: 4px; box-sizing: border-box; margin-bottom: 10px; background: #0f1425; color: #f5f7ff;" 
              autofocus />
            <div id="share-error" style="color: #ff6b6b; margin-bottom: 10px; font-size: 12px;"></div>
            <div style="display: flex; gap: 10px;">
              <button id="btn-approve-share" 
                style="flex: 1; padding: 10px; background: linear-gradient(135deg, #4f7dff, #8f67ff); color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: 600;">
                Approve & Share
              </button>
              <button id="btn-cancel-share" 
                style="flex: 1; padding: 10px; background: #6a7a99; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: 600;">
                Cancel
              </button>
            </div>
          </div>
        `;

        document.body.appendChild(modal);

        document.getElementById('btn-approve-share').addEventListener('click', async () => {
          await approveAndShareSecret(itemId, recipientUserId);
        });

        document.getElementById('btn-cancel-share').addEventListener('click', () => {
          modal.remove();
        });

        document.getElementById('share-password').focus();
      }

      // Approve sharing: verify owner password, unwrap DEK owner version, rewrap for recipient (Flow 4 inner steps)
      async function approveAndShareSecret(itemId, recipientUserId) {
        const masterPassword = document.getElementById('share-password').value;
        const errorEl = document.getElementById('share-error');

        if (!masterPassword) {
          errorEl.textContent = 'Enter your master password';
          return;
        }

        try {
          log('\n🤝 Approving & sharing secret...');
          
          // Step 1: Verify owner password
          log(`✅ Step 1: Verifying owner password...`);
          const derivedKEK = await deriveKEK(masterPassword, state.currentUser.salt);
          
          try {
            await decryptPayload(state.currentUser.wrappedPrivateKey, derivedKEK);
            log(`✅ Password VERIFIED`);
          } catch (err) {
            throw new Error(`Invalid password - verification failed`);
          }

          // Step 2: Fetch owner's wrapped DEK
          log(`📤 Step 2: Fetching wrapped DEK from backend...`);
          const dekFetchRes = await fetch('/vault/get-wrapped-dek', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ itemId, userId: state.currentUser.id }),
          });

          if (!dekFetchRes.ok) {
            const err = await dekFetchRes.json();
            throw new Error(err.error || 'Failed to fetch wrapped DEK');
          }

          const dekData = await dekFetchRes.json();
          log(`✅ Received wrapped DEK`);

          // Step 3: Unwrap DEK using owner's private key (ECIES: ephemeral pub key is in the blob)
          log(`🔓 Step 3: Unwrapping DEK with owner's private key...`);
          const dekRaw = await unwrapDEKWithPrivateKey(
            dekData.wrappedDEK,
            state.currentUser.privateKeyJwk
          );
          log(`✅ DEK unwrapped`);

          // Step 4: Get recipient's public key
          log(`📥 Step 4: Fetching recipient's public key...`);
          const recipientPublicKey = state.user2.publicKeyJwk;
          if (!recipientPublicKey) {
            throw new Error('Recipient public key not available');
          }
          log(`✅ Got recipient public key`);

          // Step 5: Rewrap DEK for recipient — ECIES, only recipient public key needed
          log(`🔐 Step 5: Rewrapping DEK for recipient (ECIES)...`);
          const wrappedDEKForRecipient = await wrapDEKWithPublicKey(
            dekRaw,
            recipientPublicKey  // ECIES: generates fresh ephemeral keypair, no owner private key
          );
          log(`✅ DEK rewrapped for recipient`);

          // Step 6: Send to backend to grant access
          log(`📤 Step 6: Granting access on backend...`);
          const approveRes = await fetch('/vault/approve-access', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              itemId,
              requesterUserId: recipientUserId,
              wrappedDEKForRequester: wrappedDEKForRecipient,
            }),
          });

          if (!approveRes.ok) {
            const err = await approveRes.json();
            throw new Error(err.error || 'Approval failed');
          }

          log(`✅ Access granted! Recipient can now view the secret\n`);
          document.getElementById('share-approval-modal').remove();

        } catch (err) {
          console.error(err);
          errorEl.textContent = '❌ ' + err.message;
          log(`❌ Sharing FAILED: ${err.message}\n`);
        }
      }
    </script>

    <script>
      // FLOW 6: Revoke access from a user
      async function revokeAccess(itemId, revokeUserId) {
        try {
          log(`\n❌ Revoking access...`);
          log(`   Secret: ${itemId}`);
          log(`   Revoke User: ${revokeUserId}\n`);

          const revokeRes = await fetch('/vault/revoke-access', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              itemId,
              ownerId: state.currentUser.id,
              revokeUserId,
            }),
          });

          if (!revokeRes.ok) {
            const err = await revokeRes.json();
            throw new Error(err.error);
          }

          const revokeData = await revokeRes.json();
          log(`✅ ${revokeData.message}`);
          log(`   User ${revokeData.revokedUsername} can NO LONGER decrypt this secret\n`);

          return true;
        } catch (err) {
          log(`❌ Revoke failed: ${err.message}\n`);
          console.error(err);
          return false;
        }
      }

      // Owner-facing modal: list secrets + users with access, allow revocation via X button
      async function openRevokeAccessModal() {
        try {
          log('\n❌ Opening revoke access dialog...');
          const res = await fetch('/debug/state');
          if (!res.ok) {
            throw new Error('Failed to load server state');
          }
          const { users, vaultItems, wrappedDEKs } = await res.json();

          const ownerId = state.currentUser.id;
          if (!ownerId) {
            alert('No current owner selected');
            return;
          }

          // Build a list of secrets owned by current user and their grantees
          const entries = [];
          for (const [itemId, item] of Object.entries(vaultItems || {})) {
            if (item.ownerId !== ownerId) continue;
            const grants = wrappedDEKs?.[itemId] || {};
            for (const [userId, wrapped] of Object.entries(grants)) {
              if (!wrapped) continue;
              if (userId === ownerId) continue; // skip self
              const user = users[userId];
              entries.push({
                itemId,
                userId,
                username: user?.username || userId,
                householdId: item.householdId,
                schemaType: item.schemaType,
              });
            }
          }

          if (entries.length === 0) {
            alert('No users currently have delegated access to your secrets.');
            return;
          }

          const existing = document.getElementById('revoke-access-modal');
          if (existing) existing.remove();

          const modal = document.createElement('div');
          modal.id = 'revoke-access-modal';
          modal.className = 'modal-overlay';

          let rows = '';
          for (const entry of entries) {
            rows += `
              <div style="display: flex; align-items: center; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #303a5e;">
                <div style="font-size: 13px;">
                  <div><strong>Secret:</strong> ${entry.itemId} <span style="color:#8fa3cc;">(${entry.schemaType || 'unknown'})</span></div>
                  <div style="color:#8fa3cc; font-size:12px;">Household: ${entry.householdId || '-'}</div>
                  <div style="margin-top:4px;">User: <strong>${entry.username}</strong> <span style="color:#8fa3cc;">(${entry.userId})</span></div>
                </div>
                <button 
                  data-item-id="${entry.itemId}"
                  data-user-id="${entry.userId}"
                  style="
                    width: 28px;
                    height: 28px;
                    border-radius: 50%;
                    border: 1px solid #ff6b6b;
                    background: rgba(255,107,107,0.1);
                    color: #ff6b6b;
                    font-weight: bold;
                    cursor: pointer;
                  "
                  title="Revoke access from this user">
                  ×
                </button>
              </div>
            `;
          }

          modal.innerHTML = `
            <div class="modal">
              <h3>❌ Revoke Access</h3>
              <p>Click the <strong>×</strong> next to a user to remove their ability to decrypt that secret.</p>
              <div style="margin-top: 12px; max-height: 320px; overflow-y: auto;">
                ${rows}
              </div>
              <div class="modal-buttons">
                <button class="btn-secondary" onclick="document.getElementById('revoke-access-modal').remove();">Close</button>
              </div>
            </div>
          `;

          document.body.appendChild(modal);

          // Wire up revoke buttons
          modal.querySelectorAll('button[data-item-id]').forEach((btn) => {
            btn.addEventListener('click', async (e) => {
              const itemId = e.currentTarget.getAttribute('data-item-id');
              const userId = e.currentTarget.getAttribute('data-user-id');
              if (!itemId || !userId) return;

              const confirmed = confirm(`Revoke access for user ${userId} on secret ${itemId}?`);
              if (!confirmed) return;

              const ok = await revokeAccess(itemId, userId);
              if (ok) {
                // Remove row from UI
                const row = e.currentTarget.parentElement;
                row?.remove();
              }
            });
          });
        } catch (err) {
          log(`❌ Failed to open revoke dialog: ${err.message}\n`);
          console.error(err);
          alert('Failed to open revoke dialog: ' + err.message);
        }
      }
    </script>
  </body>
</html>
